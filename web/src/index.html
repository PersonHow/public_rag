<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Public LLM · Skvalves</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 佔位符由 nginx 於回應時代換成該請求的 CSP nonce，見 nginx.conf 的 sub_filter。
       ng serve 不經 nginx 也不送 CSP，佔位符原樣留著不影響本機開發。 -->
  <app-root ngCspNonce="__CSP_NONCE__"></app-root>
</body>
</html>
