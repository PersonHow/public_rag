<header class="topbar">
  <button class="tb-brand" routerLink="/hub">
    <div class="brand-dot small"></div>
    <span class="px-mono">PUBLIC_LLM</span>
  </button>

  @if (isSuperAdmin()) {
    <div class="tb-company-picker">
      <span class="px-label">TENANT</span>
      <select class="co-select mono"
        [ngModel]="ctx.activeCompanyId() ?? '' "
        (ngModelChange)="onCompanyChange($event)">
        <option value="">— 全局視角 —</option>
        @for (c of ctx.companies(); track c.company_id) {
          <option [value]="c.company_id">{{ c.name }}</option>
        }
      </select>
    </div>
  } @else {
    <div class="tb-tenant">
      <span class="px-label">TENANT</span>
      <span class="px-mono" style="font-size:12px">{{ companyName() }}</span>
    </div>
  }

  <nav class="tb-nav">
    @for(s of headerSelected(); track s.title; let idx = $index){
      <a class="px-tab mono" [routerLink]="s.go" routerLinkActive="active">
        <span class="px-tab-text">
          <span class="px-section-num small">{{s.sectionNum+(idx+1)}}</span>
          <span>{{s.title}}</span>
        </span>
      </a>
    }
  </nav>

  <div class="tb-spacer"></div>

  <div class="tb-me">
    <div class="px-avatar mono">{{ avatarChar() }}</div>
    <div class="me-meta">
      <div class="nm mono">{{ email() }}</div>
      <div class="rl mono">{{ role() }}</div>
    </div>
    <app-button variant="icon" (click)="logout()" title="登出">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </app-button>
  </div>
</header>

<div class="main-content">
  <router-outlet />
</div>
