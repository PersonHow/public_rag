<app-page-head
  stamp="ADMIN · USERS"
  title="使用者管理"
  desc="租戶成員與角色管理（需要 superadmin 或 company_admin）">
  <button actions class="btn" (click)="load()">↺ 重新整理</button>
</app-page-head>

@if (loading() || (!loading() && users().length === 0)) {
  <app-empty-state [loading]="loading()" message="無使用者資料">
    @if (apiError()) {
      <div style="margin-top:12px;font-size:11px;color:var(--rust)">{{ apiError() }}</div>
    }
  </app-empty-state>
}

@if (!loading() && users().length > 0) {
  <div class="card" style="padding:0;overflow:hidden">
    <table class="users-table">
      <thead>
        <tr>
          <th>User ID</th>
          <th>Email</th>
          <th>角色</th>
          <th>狀態</th>
          <th>Company</th>
        </tr>
      </thead>
      <tbody>
        @for (u of users(); track u.user_id) {
          <tr>
            <td class="uid">{{ u.user_id | truncateId }}</td>
            <td>{{ u.email }}</td>
            <td>
              <app-status-badge [label]="u.role" [color]="roleColor(u.role)" />
            </td>
            <td>
              <app-status-badge
                [label]="u.is_active ? '啟用' : '停用'"
                [color]="u.is_active ? 'teal' : 'rust'" />
            </td>
            <td style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">
              {{ u.company_id ?? '—' }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
