<div class="page-head">
  <div>
    @if (stamp()) {
      <span class="px-stamp"
            [class.rust]="stampColor() === 'rust'"
            [class.teal]="stampColor() === 'teal'">
        {{ stamp() }}
      </span>
    }
    <h1>{{ title() }}</h1>
    @if (desc()) { <p class="page-desc">{{ desc() }}</p> }
    <ng-content select="[subtitle]" />
  </div>
  <ng-content select="[actions]" />
</div>
