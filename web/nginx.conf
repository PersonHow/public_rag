server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 資安弱掃修復：CSP 與防點擊劫持標頭。
    # style-src 'unsafe-inline'：Angular 執行期以 <style> 注入元件樣式，不可移除。
    # fonts.googleapis.com / fonts.gstatic.com：index.html 引用的 Google Fonts。
    # img-src data:：SCSS 內嵌的 data:image/svg+xml 圖示。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    # 反向代理：/api/* → 後端 Cloud Run（對瀏覽器同源，cookie 才能以 SameSite=Lax 運作）。
    # BACKEND_HOST 於容器啟動時由 envsubst 注入，例如 public-rag-backend-xxx.a.run.app。
    location /api/ {
        proxy_pass https://${BACKEND_HOST}/;
        proxy_http_version 1.1;
        proxy_set_header Host ${BACKEND_HOST};
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — all unknown paths → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx 的 add_header 不跨層級疊加：本區塊有自己的 add_header 後，
        # server 層的安全標頭不再繼承，必須在此重複宣告。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
