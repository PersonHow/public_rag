server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # 反向代理：/api/* → 後端 Cloud Run（對瀏覽器同源，cookie 才能以 SameSite=Lax 運作）。
    # BACKEND_HOST 於容器啟動時由 envsubst 注入，例如 public-rag-backend-xxx.a.run.app。
    location /api/ {
        proxy_pass https://${BACKEND_HOST}/;
        proxy_http_version 1.1;
        proxy_set_header Host ${BACKEND_HOST};
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # 後端據此確認請求出自本層 proxy，擋掉直接打後端網址的呼叫。
        # 用 proxy_set_header 而非 add_header：它會覆蓋掉客戶端自帶的同名標頭。
        proxy_set_header X-Proxy-Auth "${PROXY_SHARED_SECRET}";

        # 後端自己也送 CSP 與 X-Frame-Options，不隱藏會與此處的 add_header 疊成兩份同名標頭。
        # API 回應為 JSON，一律採用本層（前端）的標頭定義。
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;

        # API 回應含聊天紀錄與使用者資料，不該被任何中間層快取。
        # 後端目前不送 Cache-Control，proxy_hide_header 是防它日後開始送而疊成兩份。
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        # 上面一有 add_header，server 層的安全性標頭就不再繼承，必須在此補回。
        include /etc/nginx/security-headers.conf;
    }

    # SPA fallback — all unknown paths → index.html
    # index.html 不可快取：帶雜湊的靜態資源檔名每次建置都變，
    # 若外層快取住舊的 index.html，使用者會一直載到已不存在的 chunk。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # Static asset caching
    # 不用 expires 指令：它會自行送出一個 Cache-Control，與下方 add_header 疊成兩份
    # 同名標頭，重複時各家快取的取用規則不一致。改為單一宣告。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        # 這裡刻意不加 always：add_header 預設只套用在 2xx/3xx，
        # 才不會把 404 也標成可快取一年——資源短暫遺失時客戶端會記住整年。
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
