# 資安弱掃修復：安全性回應標頭集中定義。
# nginx 的 add_header 不跨層級疊加——只要 location 內有自己的 add_header，
# server 層的標頭就不再繼承，因此每個有 add_header 的 location 都要 include 本檔。
#
# style-src 'nonce-$request_id'：取代原本的 'unsafe-inline'（ZAP Plugin 10055 Medium）。
# $request_id 是 nginx 每請求產生的 32 字元亂數，nginx.conf 的 sub_filter 會把同一個值
# 注入 index.html 的 inline <style> 與 <app-root ngCspNonce>，兩邊必須一致才不會掉樣式。
# 注意：瀏覽器一旦看到 nonce 就會忽略 'unsafe-inline'，兩者不能並存當成向後相容。
# fonts.googleapis.com / fonts.gstatic.com：index.html 引用的 Google Fonts。
# img-src data:：SCSS 內嵌的 data:image/svg+xml 圖示。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
